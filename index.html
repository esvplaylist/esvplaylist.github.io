<!DOCtype html>
<html>
    <head>
        <title>ESV Playlist</title>
        <link rel="stylesheet"
        	href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        	integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        	crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="icon" type="image/x-icon" href="/music.png">
        <title>ESV Playlist</title>
        <link rel="canonical" href="https://esvplaylist.github.io/esvplaylist.github.io/" />
        <link rel="manifest" href="/esvplaylist.github.io/manifest.webmanifest">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <style>
        #input.loading {
            background: url(https://www.xiconeditor.com/image/icons/loading.gif) no-repeat right center;
        }
    </style>
    <body onload='restoreMemory()'>
        <div class="container" style="max-width:350px;margin-top:10px;">
            <div class="card" style="padding:10px;">    
                <div align="center">
                    <div align="center" class="mb-2">
                        <input class="form-control" style="max-width:250px;" id="input" type="text" placeholder="i.e. John 1:1-5">
                    </div>
                    <audio style="width:250px;padding-top:10px;padding-bottom:10px;" controls id='player' src="#"></audio>
                    <div style="max-width:250px;" align="center" class="mb-2">
                        <div style="color:#adb5bd;font-size:10px;">Scripture recordings are from The ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved.</div>
                    </div>
                </div>       
            </div>
            <div id="output">
                <div class='list-group list-group' id="list"></div>
            </div>
        </div>
    
        <script
            src="https://code.jquery.com/jquery-3.3.1.min.js"
            integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
            crossorigin="anonymous"></script>
        <script
        	src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
        	integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        	crossorigin="anonymous">
        </script>
        <script
        	src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
        	integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
        	crossorigin="anonymous">
        </script>
      
        <script>
            if (navigator.serviceWorker) {
                navigator.serviceWorker.register (
                    '/service-worker.js',
                    {scope: '/'}
                )
            }

            var t = [84, 111, 107, 101, 110, 32, 57, 100, 100, 49, 54, 55, 48, 50, 98, 98, 55, 56, 51, 55, 56, 51, 98, 49, 57, 50, 49, 54, 97, 55, 56, 100, 55, 52, 54, 55, 48, 102, 50, 99, 100, 100, 97, 54, 55, 51];
            var a = { headers: { authorization: t.map(e => e = String.fromCharCode(e)).join().replace(/,/g,'') } };

            const ui = {
                placeholders : {
                    default: 'i.e. John 1:1-5',
                    get_esv: 'Getting ESV Audio ...',
                }
            };

            var audioSources = [];
            var audio = document.getElementById('player');

            function showInProgress() {
                document.getElementById("input").value = "";
                document.getElementById("input").setAttribute('placeholder', ui.placeholders.get_esv);
                $("#input").addClass('loading');
                document.getElementById("input").disabled = true;
            }
            function removeInProgress() {
                document.getElementById("input").setAttribute('placeholder', ui.placeholders.default);
                document.getElementById("input").disabled = false;
                $("#input").removeClass('loading');
            }
            
            // list functions
            function addTrackToList() {
                var elem = document.getElementById("input").value;
                if (!elem) return;
                showInProgress();

                if (elem.includes(',')) {
                    elem = elem.substring(0, elem.indexOf(','));
                } 

                var url = 'https://api.esv.org/v3/passage/html/?q=' + elem;
                
                fetch(url, a)
                .then(function (response) {
                    return response.json();
                })
                .then(function (responseJson) {
                    if (responseJson.canonical) {
                        addListItem(responseJson);
                    } else removeInProgress();
                });
                
            }

            function removeTrackFromList() {
                let elementId = $(event.target).attr("id");
                let trackIdx = audioSources.findIndex(e => e._id == elementId);
                if (trackIdx >= 0) {
                    audioSources.splice(trackIdx, 1);
                    if (audioSources.length > 0) {
                        setAndLoadPlayer(audioSources[0]);
                    } else {
                        audio.src = '';
                        audio.pause();
                    }
                }
                let targetElems = $("li[id="+elementId+"]").get();
                $(targetElems).remove();
                updateStorage();

            }

            function addListItem(responseJson) {
                //console.log(responseJson);
                let audioUrlTemp = 'https://audio.esv.org/david-cochran-heath/mq/{start}-{end}.mp3';
                let audioContentSrc = audioUrlTemp.replace('{start}', responseJson.parsed[0][0]).replace('{end}', responseJson.parsed[0][1]);

                var id = responseJson.parsed[0][0] + responseJson.parsed[0][1];
                if (id) {
                    // create new list entry
                    var list_item = document.createElement("LI");
                    list_item.setAttribute("id", id);
                    $(list_item).addClass('list-group-item');
                    $(list_item).attr("contenteditable","false");
                
                    // add play button
                    var btn_play = $(list_item).add('<button type="button" class="btn btn-outline-secondary btn-sm" onclick="playTrack()">&#9654;</button>');
                    $(btn_play).attr("id", id);
                    $(list_item).append(btn_play);

                    // add remove button
                    var btn_delete = $(list_item).add("<button class='btn btn-outline-danger btn-sm' onclick='removeTrackFromList()' style='margin-left:3px;margin-right:15px;'>&#x2715</button>");
                    $(btn_delete).attr("id", id);
                    $(list_item).append(btn_delete);
                    
                    // add content
                    var item_content = document.createTextNode(responseJson.canonical);
                    list_item.appendChild(item_content);

                    // add playing now icon
                    var playingIcon = '&nbsp&nbsp<i style="display:none;" class="bi bi-mic-fill" id="' + id + '_icon"></i>';
                    $(list_item).append(playingIcon);
                    
                    // add to existing list
                    document.getElementById("list").appendChild(list_item);

                    audioSources.push({
                        _id: id,
                        url: audioContentSrc
                    });

                    // set player to first track
                    if (audioSources.length == 1) {
                        setAndLoadPlayer(audioSources[0], false); 
                    }       
                }
                removeInProgress();
                updateStorage();
            }

            // player functions
            function setAndLoadPlayer (source, startPlay) {
                audio.src = source.url; 
                audio.pause();  
                audio.load();
                if (startPlay) audio.play();
            }
            function playTrack() {
                clearTrackIcons();
                let id = $(event.target).attr("id");
                let trackIdx = audioSources.findIndex(e => e._id == id);  
                setAndLoadPlayer(audioSources[trackIdx], true); 
            }
            function getNextTrack() {
                if (audio.src && audioSources.length > 0) {
                    clearTrackIcons();
                    let trackIdx = audioSources.findIndex(e => e.url == audio.src);
                    let id = audioSources[trackIdx]._id + '_icon';
                    document.getElementById(id).style.display = 'none';
                    if (trackIdx + 1 < audioSources.length) {
                        setAndLoadPlayer(audioSources[trackIdx+1], true);
                        document.getElementById(id).style.display = 'inline';
                    } else {
                        setAndLoadPlayer(audioSources[0], true);
                        document.getElementById(id).style.display = 'inline';
                    }
                }
            }
            function showCurrentTrack() {
                if (audio.src && audioSources.length > 0) {
                    clearTrackIcons();
                    let trackIdx = audioSources.findIndex(e => e.url == audio.src);
                    let id = audioSources[trackIdx]._id + '_icon';
                    document.getElementById(id).style.display = 'none';
                    if (trackIdx + 1 < audioSources.length) {
                        document.getElementById(id).style.display = 'inline';
                    } else {
                        document.getElementById(id).style.display = 'inline';
                    }
                }
            }
            function clearTrackIcons() {
                audioSources.forEach(function(audio){
                    let id = audio._id+'_icon';
                    document.getElementById(id).style.display = 'none';
                });
            }

            // storage functions
            function updateStorage() {
                localStorage.setItem('esvplaylist_sources', JSON.stringify(audioSources));
                localStorage.setItem('esvplaylist', document.getElementById('list').outerHTML);
            }
            function checkStorage(key) {
                return localStorage.getItem(key);
            }
            function restoreMemory() {
                if (localStorage.getItem('esvplaylist')) {
                    var list = localStorage.getItem('esvplaylist');
                    list = list.replace(/<i style="display: inline;"/g, '<i style="display: none;"');
                    document.getElementById('list').outerHTML = list;

                    audioSources = JSON.parse(localStorage.getItem('esvplaylist_sources'));
                    if (audioSources && audioSources.length > 0) {
                        setAndLoadPlayer(audioSources[0], false);
                    }
                }
            }

            // event listener functions
            audio.addEventListener('ended',getNextTrack);
            audio.addEventListener('play',showCurrentTrack);
            
            $(document).keypress(function(e) {
                if(e.which == 13) {
                    addTrackToList();
                };
            });
        </script>
    </body>
</html>
