<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ESV Playlist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="white" />

  <link rel="icon" type="image/x-icon" href="/headphone-symbol.png">
  <link rel="canonical" href="https://esvplaylist.github.io/esvplaylist.github.io/" />
  <link rel="manifest" crossorigin="use-credentials" href="manifest.json"/>

  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

  <style>
    body { background: #f8f9fa; color: #212529; }
    body.dark { background: #121212; color: #f8f9fa; }

    .card, .list-group-item { background: inherit; color: inherit; }

    .playlist-item.active {
      background-color: #007bff;
      color: white;
    }

    .now-playing {
      border-left: 6px solid #28a745;
      font-weight: bold;
    }

    li[draggable="true"] { cursor: grab; }

    .reorder-btn {
      width: 26px;
      padding: 0;
      line-height: 1;
    }

    footer {
      font-size: 10px;
      color: #adb5bd;
      margin-top: 30px;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>

<body onload="restoreMemory()">

<div class="container" style="max-width: 900px; margin-top: 15px;">

  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4>🎧 ESV Playlist</h4>
    <!-- <button class="btn btn-sm btn-outline-secondary" onclick="toggleDarkMode()">🌙</button> -->
  </div>

  <!-- Playlist Creation -->
  <div class="card mb-3">
    <div class="card-body row">
      <div class="col-md-8 mb-2">
        <input id="newPlaylistName" class="form-control" placeholder="New Playlist Name">
      </div>
      <div class="col-md-4">
        <button class="btn btn-primary btn-block" onclick="createPlaylist()">Create Playlist</button>
      </div>
    </div>
  </div>

  <div class="row">

    <!-- Playlist List -->
    <div class="col-md-4 mb-3">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Playlists</span>
          <button class="btn btn-sm btn-outline-secondary" onclick="renamePlaylist()">Rename</button>
        </div>
        <ul id="playlistList" class="list-group list-group-flush"></ul>
      </div>
    </div>

    <!-- Player & Tracks -->
    <div class="col-md-8">

      <div class="card mb-3">
        <div class="card-body text-center">
          <input class="form-control mb-2" id="input" type="text" placeholder="i.e. John 1:1-5">
          <audio id="player" controls></audio>
          <!-- <div class="mt-2">
            <button class="btn btn-outline-info btn-sm" onclick="toggleShuffle()">Shuffle</button>
          </div> -->
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between">
          <span>Tracks (Drag or Use ⬆⬇)</span>
          <button class="btn btn-sm btn-danger" onclick="deleteCurrentPlaylist()">Delete Playlist</button>
        </div>
        <ul class="list-group list-group-flush" id="list"></ul>
      </div>
    </div>
  </div>

  <footer>
    Scripture recordings are from The ESV® Bible (The Holy Bible, English Standard Version®),
    © 2001 by Crossway, a publishing ministry of Good News Publishers.
    Used by permission. All rights reserved.
  </footer>

</div>

<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>

<script>
/* DARK MODE */
function toggleDarkMode() {
  document.body.classList.toggle("dark");
  localStorage.setItem("esv_dark", document.body.classList.contains("dark"));
}

/* ESV AUTH */
var t = [84,111,107,101,110,32,57,100,100,49,54,55,48,50,98,98,55,56,51,55,56,51,98,49,57,50,49,54,97,55,56,100,55,52,54,55,48,102,50,99,100,100,97,54,55,51];
var a = { headers: { authorization: t.map(e => String.fromCharCode(e)).join('').replace(/,/g,'') } };

var audio = document.getElementById('player');
var audioSources = [];
var isShuffle = false;

let playlists = JSON.parse(localStorage.getItem("esv_playlists")) || {};
let currentPlaylist = localStorage.getItem("esv_currentPlaylist") || null;

function savePlaylists() {
  localStorage.setItem("esv_playlists", JSON.stringify(playlists));
  localStorage.setItem("esv_currentPlaylist", currentPlaylist);
}

/* PLAYLISTS */
function createPlaylist() {
  const name = document.getElementById("newPlaylistName").value.trim();
  if (!name || playlists[name]) return;
  playlists[name] = [];
  currentPlaylist = name;
  audioSources = [];
  document.getElementById("newPlaylistName").value = "";
  savePlaylists();
  renderPlaylists();
  renderTracks();
}

function renamePlaylist() {
  if (!currentPlaylist) return;
  const newName = prompt("Rename playlist:", currentPlaylist);
  if (!newName || playlists[newName]) return;
  playlists[newName] = playlists[currentPlaylist];
  delete playlists[currentPlaylist];
  currentPlaylist = newName;
  savePlaylists();
  renderPlaylists();
}

function deleteCurrentPlaylist() {
  if (!currentPlaylist) return;
  if (!confirm("Delete this playlist?")) return;
  delete playlists[currentPlaylist];
  currentPlaylist = Object.keys(playlists)[0] || null;
  audioSources = currentPlaylist ? playlists[currentPlaylist] : [];
  savePlaylists();
  renderPlaylists();
  renderTracks();
}

function selectPlaylist(name) {
  currentPlaylist = name;
  audioSources = playlists[name] || [];
  savePlaylists();
  renderPlaylists();
  renderTracks();
}

/* SHUFFLE */
function toggleShuffle() {
  isShuffle = !isShuffle;
  alert("Shuffle " + (isShuffle ? "On" : "Off"));
}

/* TRACKS */
function moveTrackUp(index) {
  if (index === 0) return;
  [audioSources[index - 1], audioSources[index]] = [audioSources[index], audioSources[index - 1]];
  savePlaylists();
  renderTracks();
}

function moveTrackDown(index) {
  if (index === audioSources.length - 1) return;
  [audioSources[index + 1], audioSources[index]] = [audioSources[index], audioSources[index + 1]];
  savePlaylists();
  renderTracks();
}

function playTrack() {
  let id = event.target.id;
  let idx = audioSources.findIndex(x => x._id === id);
  playByIndex(idx);
}

function playByIndex(idx) {
  if (!audioSources[idx]) return;
  audio.src = audioSources[idx].url;
  audio.dataset.index = idx;
  audio.play();
  renderTracks();
}

audio.addEventListener("ended", function() {
  let idx = parseInt(audio.dataset.index || 0);
  idx = isShuffle ? Math.floor(Math.random() * audioSources.length) : (idx + 1) % audioSources.length;
  playByIndex(idx);
});

let dragStartIndex = null;

function renderTracks() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  audioSources.forEach((track, index) => {
    let li = document.createElement("li");
    li.className = "list-group-item d-flex align-items-center";
    li.draggable = true;

    if (parseInt(audio.dataset.index) === index) {
      li.classList.add("now-playing");
    }

    li.addEventListener("dragstart", () => dragStartIndex = index);
    li.addEventListener("dragover", e => e.preventDefault());
    li.addEventListener("drop", () => {
      [audioSources[dragStartIndex], audioSources[index]] =
      [audioSources[index], audioSources[dragStartIndex]];
      savePlaylists();
      renderTracks();
    });

    li.innerHTML = `
      <button class="btn btn-outline-secondary btn-sm mr-2" id="${track._id}" onclick="playTrack()">▶</button>
      <span class="flex-grow-1">${track.label}</span>
      <button class="btn btn-outline-secondary btn-sm reorder-btn mr-1" onclick="moveTrackUp(${index})">⬆</button>
      <button class="btn btn-outline-secondary btn-sm reorder-btn mr-2" onclick="moveTrackDown(${index})">⬇</button>
    `;

    list.appendChild(li);
  });
}

/* INIT */
function restoreMemory() {
  if (localStorage.getItem("esv_dark") === "true") {
    document.body.classList.add("dark");
  }
  if (currentPlaylist && playlists[currentPlaylist]) {
    audioSources = playlists[currentPlaylist];
  }
  renderPlaylists();
  renderTracks();
}

function renderPlaylists() {
  const list = document.getElementById('playlistList');
  list.innerHTML = "";
  Object.keys(playlists).forEach(name => {
    const li = document.createElement('li');
    li.className = "list-group-item playlist-item " + (name === currentPlaylist ? "active" : "");
    li.textContent = name;
    li.onclick = () => selectPlaylist(name);
    list.appendChild(li);
  });
}
</script>

</body>
</html>
